name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: teamflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamflow" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://teamflow:ci-password@127.0.0.1:5432/teamflow_test
      TEST_DATABASE_URL: postgresql+psycopg://teamflow:ci-password@127.0.0.1:5432/teamflow_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # Test against exactly the versions the Docker image ships.
      - run: pip install --no-deps -r requirements.lock && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing
      - name: Migrations match the models
        run: alembic upgrade head && alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # type-checks, then bundles
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t teamflow-backend:ci backend
      - run: docker build -t teamflow-frontend:ci frontend
      - name: Production compose file is valid
        env:
          DOMAIN: ci.example.com
          ACME_EMAIL: ci@example.com
          REDIS_PASSWORD: ci
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: ci
          JWT_SECRET_KEY: ci
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
