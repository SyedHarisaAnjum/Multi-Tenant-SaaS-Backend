# Production only (mounted by docker-compose.prod.yml), included in nginx's http block.
# nginx publishes no port there: its only client is Caddy, which sets X-Forwarded-For to
# the real client address. Without this, every request would appear to come from Caddy
# and per-IP rate limits would throttle all users together.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
