# Serves the SPA and proxies the API, so the browser sees one origin: the HttpOnly,
# SameSite=Strict refresh cookie just works and no CORS is needed.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API, health and the interactive docs go to the backend.
    location ~ ^/(api/|health$|docs|openapi\.json$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite (don't append to) X-Forwarded-For: the backend trusts this header for
        # per-IP rate limits, so a client must not be able to inject its own value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One id across nginx and backend logs.
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build assets never change: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes fall back to index.html, which must never be cached stale.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
