name: teamflow

# This file alone is the production-safe base: nothing but the web entry point is
# reachable from outside the Docker network.
#
# Local (base + docker-compose.override.yml, loaded automatically):
#   docker compose up --build              → http://localhost:8080, Postgres :5433, Redis :6380
#   docker compose up -d db redis          → infra only, for running backend/frontend on the host
# Production (base + docker-compose.prod.yml, adds HTTPS):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Start-up order is gated on readiness, not just "container started":
#   db healthy → migrate exits 0 → backend healthy (/health/ready reaches the DB) → frontend

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  # Inside the compose network services are addressed by name, not localhost.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamflow}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  INVITATION_EXPIRE_HOURS: ${INVITATION_EXPIRE_HOURS:-72}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  # Secure cookies need HTTPS. Plain-http local runs set COOKIE_SECURE=false in .env.
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  LOG_FORMAT: ${LOG_FORMAT:-text}

# Bounded logs: the default json-file driver grows until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The app containers need no Linux capabilities and never write to their image.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-teamflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    shm_size: 128mb
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Cache + rate-limit counters only: no persistence needed, bounded memory.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: bring the schema to head, then exit. The backend waits for success.
  migrate:
    build: ./backend
    image: teamflow-backend:local
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    <<: *hardened
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: teamflow-backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For from any peer: safe ONLY because this service publishes no
      # port, so nginx (which overwrites the header) is the only thing that can reach it.
      FORWARDED_ALLOW_IPS: "*"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    expose:
      - "8000"
    <<: *hardened
    logging: *logging
    # Matches uvicorn's --timeout-graceful-shutdown, plus headroom.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: teamflow-frontend:local
    restart: unless-stopped
    read_only: true
    # nginx's master starts as root, binds :80, then drops to the nginx user.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy

  # worker: background jobs (email delivery, cleanup) will go here later, built from
  # ./backend with its own command and the same x-backend-env.

volumes:
  pgdata:
